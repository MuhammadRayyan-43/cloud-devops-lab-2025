- name: Deploy the tool stack
  hosts: app
  become: yes

  tasks:
    - name: Create a directory for the stack
      file:
        path: /opt/tool-stack
        state: directory

    - name: Copy docker-compose.yml and config files to the target host
      copy:
        src: "../docker/{{ item }}"
        dest: /opt/tool-stack/
      with_items:
        - docker-compose.yml
        - nginx.conf
        - prometheus.yml
        
    - name: Install docker CLI inside Jenkins
      shell: |
        docker exec -u root tool-stack-jenkins-1 bash -c '
          apt-get update &&
          apt-get install -y docker.io &&
          usermod -aG docker jenkins
        '
      args:
        creates: /dev/null

    - name: Start Jenkins and nginx
      command: docker compose up -d nginx jenkins
      args:
        chdir: /opt/tool-stack